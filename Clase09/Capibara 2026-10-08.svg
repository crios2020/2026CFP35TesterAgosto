    <radialGradient id="nose" cx="40%" cy="35%">
      <stop offset="0" stop-color="#5d5148"/>
      <stop offset=".65" stop-color="#302b28"/>
      <stop offset="1" stop-color="#171615"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#805438"/>
      <stop offset="1" stop-color="#49382f"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- subtle ground shadow -->
  <ellipse cx="590" cy="694" rx="430" ry="35" fill="#000" opacity=".14" filter="url(#shadow)"/>

