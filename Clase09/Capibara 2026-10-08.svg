<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="fur" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#c9955d"/>
      <stop offset=".48" stop-color="#a96f3f"/>
      <stop offset="1" stop-color="#70472e"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd8954"/>
      <stop offset="1" stop-color="#765039"/>
